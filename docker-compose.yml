# Stack yang di-deploy Hostinger (app, web, db, cache, worker).
# Kode Laravel, aset Vite, dan default.conf masuk image — jangan di-bind dari host
# (bind file yang belum ada membuat Docker membuat folder).
services:
  app:
    image: ceco-php
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_NAME: C-ECO
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-https://c-eco.tech}
      APP_KEY: ${APP_KEY:-}
      APP_LOCALE: id
      APP_FALLBACK_LOCALE: id
      APP_TIMEZONE: Asia/Jakarta
      CAT_MODE: ${CAT_MODE:-adaptive}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-db_ceco}
      DB_USERNAME: ${DB_USERNAME:-app}
      DB_PASSWORD: ${DB_PASSWORD:-app123}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SESSION_DRIVER: redis
      SESSION_SECURE_COOKIE: "true"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-error}
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ceco

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${CECO_HTTP_PORT:-8019}:80"
    depends_on:
      - app
    networks:
      - ceco

  worker:
    image: ceco-php
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_NAME: C-ECO
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-https://c-eco.tech}
      APP_KEY: ${APP_KEY:-}
      APP_LOCALE: id
      APP_FALLBACK_LOCALE: id
      APP_TIMEZONE: Asia/Jakarta
      CAT_MODE: ${CAT_MODE:-adaptive}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-db_ceco}
      DB_USERNAME: ${DB_USERNAME:-app}
      DB_PASSWORD: ${DB_PASSWORD:-app123}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SESSION_DRIVER: redis
      SESSION_SECURE_COOKIE: "true"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-error}
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      - app
      - redis
    networks:
      - ceco

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - ceco

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-db_ceco}
      MYSQL_USER: ${DB_USERNAME:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ceco

networks:
  ceco:

volumes:
  db_data:
  redis_data:
  storage_data:
