# Stack yang di-deploy Hostinger (app, web, db, cache, worker).
# Pengembangan lokal masih boleh memakai ~/code/docker-compose.yml.
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ceco

  web:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "${CECO_HTTP_PORT:-8019}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - ceco

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis
    networks:
      - ceco

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - ceco

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-db_ceco}
      MYSQL_USER: ${DB_USERNAME:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ceco

networks:
  ceco:

volumes:
  db_data:
  redis_data:
