server {
    listen 80;
    http2 on;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Livewire menyajikan JS dari rute Laravel (/livewire-{hash}/livewire.js),
    # bukan berkas di public/. ^~ mengalahkan location aset statis di bawah.
    location ^~ /livewire {
        try_files $uri /index.php?$query_string;
    }

    # aset ber-hash: diunduh sekali seumur uji coba (aturan R1)
    location ~* \.(css|js|woff2|webp|png|jpg|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Nginx menampung respons supaya worker PHP cepat bebas dari klien seluler lambat
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 30s;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
