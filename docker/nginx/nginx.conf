user nginx;
worker_processes auto;
events { worker_connections 2048; multi_accept on; }
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on; tcp_nopush on; tcp_nodelay on;
    keepalive_timeout 65;
    client_body_timeout 30s;
    client_header_timeout 30s;

    gzip on; gzip_vary on; gzip_min_length 512; gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css application/javascript application/json
                 image/svg+xml application/xml;

    # jejak anggaran kuota per sesi (docs/SPEC.md bagian 8)
    log_format bytes '$remote_addr $request_uri $status $body_bytes_sent $request_time';
    access_log /var/log/nginx/access.log bytes;

    include /etc/nginx/conf.d/*.conf;
}
