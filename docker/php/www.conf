[www]
; Image produksi menyalin source ke dalam layer (bukan bind-mount host).
user = www-data
group = www-data
; disetel untuk 300 sesi serentak pada 8 GB RAM (docs/SPEC.md bagian 8)
pm = static
pm.max_children = 50
pm.max_requests = 1000
request_terminate_timeout = 30s
catch_workers_output = yes
clear_env = no
