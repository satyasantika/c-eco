[www]
; UID/GID 1000 = user host (volume bind). www-data (82) tidak bisa menulis storage/.
user = 1000
group = 1000
; disetel untuk 300 sesi serentak pada 8 GB RAM (docs/SPEC.md bagian 8)
pm = static
pm.max_children = 50
pm.max_requests = 1000
request_terminate_timeout = 30s
catch_workers_output = yes
clear_env = no
